<!doctype html>
<html>
  <body style="margin:0;background:#f6f7f8;font-family:Inter,Arial,sans-serif;color:#111">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="padding:32px 16px">
      <tr><td align="center">
        <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:440px;background:#fff;border:1px solid #e5e7eb;border-radius:16px;padding:28px">
          <tr><td style="font-size:20px;font-weight:700;color:#0f5132">NewsVio</td></tr>
          <tr><td style="padding-top:20px;font-size:16px">Welcome to NewsVio. Your code to finish creating your account:</td></tr>
          <tr><td style="padding:20px 0;font-family:'JetBrains Mono',Menlo,monospace;font-size:34px;font-weight:700;letter-spacing:8px;text-align:center">{{ .Token }}</td></tr>
          <tr><td style="font-size:14px;color:#4b5563">Enter this code in the app or website. It expires in 10 minutes.</td></tr>
          <tr><td style="padding:24px 0 8px">
            <a href="{{ .SiteURL }}/auth/confirm?token_hash={{ .TokenHash }}&type=email" style="display:inline-block;background:#0f5132;color:#fff;text-decoration:none;font-weight:600;padding:12px 20px;border-radius:10px">Sign in on this device</a>
          </td></tr>
          <tr><td style="padding-top:16px;font-size:12px;color:#6b7280">If you didn't ask for this, you can ignore this email. Nobody can sign in without the code.</td></tr>
        </table>
      </td></tr>
    </table>
  </body>
</html>
