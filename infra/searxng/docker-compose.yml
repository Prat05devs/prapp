# Local web search for the fact checker: docker compose -f infra/searxng/docker-compose.yml up -d
# Edge functions run in Docker, so they reach it at http://host.docker.internal:8888 (SEARXNG_URL).
services:
  searxng:
    image: searxng/searxng:latest
    container_name: prapp_searxng
    restart: unless-stopped
    ports:
      - '127.0.0.1:8888:8080'
    environment:
      SEARXNG_BASE_URL: http://localhost:8888/
      SEARXNG_SECRET: ${SEARXNG_SECRET:?set SEARXNG_SECRET (openssl rand -hex 32)}
    volumes:
      - ./settings.yml:/etc/searxng/settings.yml:ro
