# SearXNG for the fact checker's web search (LLD §11.3). The app calls /search?format=json.
use_default_settings: true

server:
  # Set SEARXNG_SECRET in the container environment; SearXNG refuses the default key.
  secret_key: 'ultrasecretkey'
  limiter: false # only the app calls it; keep it off the public internet
  image_proxy: false
  public_instance: false

search:
  safe_search: 1
  formats:
    - html
    - json

ui:
  static_use_hash: true
