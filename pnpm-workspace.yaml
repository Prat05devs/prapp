packages:
  - apps/*
  - packages/*

# pnpm 10 blocks install scripts by default; allow only the ones we need.
onlyBuiltDependencies:
  - supabase
  - esbuild
  - sharp
  - unrs-resolver

# Security patches for transitive dependencies (see docs/SECURITY-AUDIT.md).
overrides:
  uuid@<11.1.1: 11.1.1
  decode-uri-component@<=0.4.2: 0.5.0
  source-map-js@<1.2.2: 1.2.2
  postcss-selector-parser@<7.1.6: 7.1.6
  shell-quote@<1.11.0: 1.11.0
  follow-redirects@<1.16.1: 1.16.1
